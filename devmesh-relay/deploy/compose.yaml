services:
  postgres:
    image: postgres:17
    pull_policy: missing
    environment:
      POSTGRES_DB: devmesh
      POSTGRES_USER: devmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmesh -d devmesh"]
      interval: 5s
      timeout: 3s
      retries: 10
  devmesh-relay:
    image: ${RELAY_IMAGE:-devmesh-relay:local}
    environment:
      DATABASE_URL: postgresql://devmesh:${POSTGRES_PASSWORD}@postgres:5432/devmesh
      DEVMESH_INITIAL_PASSWORD: ${DEVMESH_INITIAL_PASSWORD:-}
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_PORT:-17843}:17843"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
